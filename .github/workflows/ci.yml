name: CI
on:
  pull_request:
  push:
    branches: [main]
# theme-check-action reports results as a check run.
permissions:
  contents: read
  checks: write
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
